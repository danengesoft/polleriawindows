server:
  address: 0.0.0.0
  port: 8080
  forward-headers-strategy: framework
spring:
  web:
    # Spring Boot 4 movió server.error.* a spring.web.error.* (la clave antigua se ignora).
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          # Firma por DNS interno; la validación de iss conserva la URL pública exacta.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  level:
    root: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
polleria:
  pagos:
    simulador-habilitado: ${PAGO_SIMULADOR_HABILITADO:false}
  web:
    cookie-secure: ${WEB_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${PUBLIC_APP_URL}
