server:
  address: 127.0.0.1
  port: 8080
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:38080/realms/polleria}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:35433/polleria}
    username: ${DB_USER:polleria}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
management:
  endpoint:
    health:
      show-details: never
polleria:
  pagos:
    simulador-habilitado: ${PAGO_SIMULADOR_HABILITADO:false}
  web:
    cookie-secure: false
  cors:
    allowed-origins: http://localhost:4200
