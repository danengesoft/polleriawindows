name: polleria-identity-dev
services:
  keycloak-db:
    image: postgres:17-alpine
    container_name: polleria-keycloak-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:35432:5432"
    environment:
      POSTGRES_DB: polleria_keycloak
      POSTGRES_USER: polleria_keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polleria_keycloak -d polleria_keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: polleria-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:38080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/polleria_keycloak
      KC_DB_USERNAME: polleria_keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:38080
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/polleria-realm.json:/opt/keycloak/data/import/polleria-realm.json:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  keycloak-postgres-data:
    name: polleria-keycloak-postgres-data
