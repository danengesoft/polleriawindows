root /usr/share/nginx/html;
access_log /dev/stdout polleria;
index index.html;
client_max_body_size 1m;
server_tokens off;
include /etc/nginx/polleria/security-headers.conf;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location = /healthz { access_log off; return 200 "ok\n"; }
# Health solo dentro de Docker. No se publica Actuator ni documentación.
location ^~ /actuator { return 404; }
location ^~ /swagger-ui { return 404; }
location ^~ /v3/api-docs { return 404; }
# Solo el endpoint de fotografías admite hasta 20 MB más el sobre multipart.
location = /api/v1/productos/imagenes {
    client_max_body_size 21m;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-ID $http_x_trace_id;
    proxy_read_timeout 60s;
}
location = /api/v1/eventos {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-ID $http_x_trace_id;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 60s;
    add_header X-Accel-Buffering no;
    include /etc/nginx/polleria/security-headers.conf;
}
location = /api/v1/web/mesas/eventos {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Trace-ID $http_x_trace_id;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 60s;
    add_header X-Accel-Buffering no;
    include /etc/nginx/polleria/security-headers.conf;
}
location = /api { return 404; }
location ^~ /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Trace-ID $http_x_trace_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
# Callback es una ruta Angular, no un endpoint Keycloak.
location = /auth/callback { try_files /index.html =404; include /etc/nginx/polleria/security-headers.conf; add_header Cache-Control "no-store"; }
# Acceso administrativo por túnel/procedimiento privado, nunca por el proxy público.
location = /auth/admin { return 404; }
location ^~ /auth/admin/ { return 404; }
location ^~ /auth/health { return 404; }
location ^~ /auth/metrics { return 404; }
location /auth/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
location = /index.html { include /etc/nginx/polleria/security-headers.conf; add_header Cache-Control "no-store"; }
location ~* "^/.*[-.][A-Za-z0-9_-]{8,}\.(js|css)$" {
    try_files $uri =404;
    expires 1y;
    include /etc/nginx/polleria/security-headers.conf;
    add_header Cache-Control "public, immutable";
}
location / { try_files $uri $uri/ /index.html; }
