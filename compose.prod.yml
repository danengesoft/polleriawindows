name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}
x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_DB: polleria
      POSTGRES_USER: polleria
      POSTGRES_PASSWORD: ${POLLERIA_DB_PASSWORD:?Set POLLERIA_DB_PASSWORD}
      TZ: America/Lima
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U polleria -d polleria"]
      interval: 5s
      timeout: 5s
      retries: 24
  keycloak-db:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_DB: polleria_keycloak
      POSTGRES_USER: polleria_keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      TZ: America/Lima
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U polleria_keycloak -d polleria_keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    command: [start, --import-realm]
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/polleria_keycloak
      KC_DB_USERNAME: polleria_keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL}/auth
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      TZ: America/Lima
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./production/generated/${COMPOSE_PROJECT_NAME}/polleria-realm.json:/opt/keycloak/data/import/polleria-realm.json:ro
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
  backend:
    image: polleria-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    build: ./polleria-backend
    volumes:
      - imagenes-productos:/app/imagenes-productos
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POLLERIA_IMAGENES_DIR: /app/imagenes-productos
      DB_URL: jdbc:postgresql://postgres:5432/polleria
      DB_USER: polleria
      DB_PASSWORD: ${POLLERIA_DB_PASSWORD:?Set POLLERIA_DB_PASSWORD}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL}
      KEYCLOAK_ISSUER_URI: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL}/auth/realms/polleria
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/polleria/protocol/openid-connect/certs
      TZ: America/Lima
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
  frontend:
    image: polleria-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    build: ./polleria-frontend
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      NGINX_ENVSUBST_FILTER: APP_DOMAIN
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80
      - ${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-443}:443
    volumes:
      - ./production/nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./production/nginx/00-logging.conf:/etc/nginx/conf.d/00-logging.conf:ro
      - ./production/nginx/locations.conf:/etc/nginx/polleria/locations.conf:ro
      - ./production/nginx/security-headers.conf:/etc/nginx/polleria/security-headers.conf:ro
      - ./production/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [internal, edge]
    healthcheck:
      test: [CMD-SHELL, "wget -q --no-check-certificate -O - https://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  imagenes-productos:
  postgres-data:
  keycloak-data:
networks:
  internal:
    internal: true
  edge:
